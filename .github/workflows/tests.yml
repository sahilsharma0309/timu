name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-suite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 soupsieve lxml pandas "httpx[http2]" openpyxl
      - name: doctor
        run: python timu_doctor.py
      - name: offline test suite (47 checks, no network)
        run: python test_timu.py
